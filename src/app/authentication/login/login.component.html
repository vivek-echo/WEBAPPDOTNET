<div class="auth-main">
  <div class="auth-wrapper">
    <div class="card login-card">
      <div class="card-body">
        <!-- Logo -->
        <div class="logo-area text-center mb-3">
          <div class="logo-circle">
            <i class="fa-solid fa-droplet"></i>
          </div>
          <div class="logo-title mt-2">ADMIN CONSOLE</div>
        </div>

        <!-- Heading -->
        <div class="text-center mb-3">
          <h2 class="welcome-title">Hi, Welcome Back</h2>
        </div>

        <div class="separator my-3"></div>

        <p class="text-center small mb-4 text-muted">
          Enter your credentials to continue
        </p>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <!-- Email -->
          <div class="mb-3">
            <label class="form-label"> Email</label>
            <div class="input-group custom-input-group">
              <span class="input-group-text">
                <i class="fa-regular fa-envelope"></i>
              </span>
              <input type="email" class="form-control" placeholder="Enter your email" formControlName="email" />
            </div>
          </div>

          <!-- Password -->
          <div class="mb-3">
            <label class="form-label">Password</label>
            <div class="input-group custom-input-group">
              <span class="input-group-text">
                <i class="fa-solid fa-lock"></i>
              </span>
              <input type="password" class="form-control" placeholder="Enter your password"
                formControlName="password" />
            </div>
          </div>

          <div class="d-flex justify-content-end mb-4">
            <a href="javascript:void(0)" class="forgot-link">Forgot Password?</a>
          </div>

          <!-- Button -->
          <button type="submit" class="btn btn-login w-100">
            <span><i class="fa-solid fa-right-to-bracket me-1"></i> SIGN IN</span>
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
